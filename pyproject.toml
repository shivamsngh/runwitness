[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runwitness-ai"
version = "0.2.0.dev0"
description = "Benchmark-agnostic deployment evidence for AI systems"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Shivam Singh"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://shivam.systems"
Repository = "https://github.com/shivamsngh/runwitness"

[project.scripts]
runwitness = "runwitness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

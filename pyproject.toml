[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldkit-ai"
version = "0.1.0"
description = "Benchmark-agnostic deployment evidence for AI systems"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
fieldkit = "fieldkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

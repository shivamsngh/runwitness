name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps --wheel-dir dist

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path collector/Cargo.toml -- --check
      - run: cargo clippy --manifest-path collector/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --manifest-path collector/Cargo.toml
      - name: Verify Linux network namespace enforcement
        # This launches repository code inside a privileged container. Keep it off
        # untrusted pull-request runners and exercise it after merge on main.
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            --privileged \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:24.04 \
            /bin/sh -c '
              grep -q "eth0:" /proc/net/dev &&
              ./collector/target/debug/runwitness-collector \
                run \
                --output /work/collector/target/network-isolation-evidence.json \
                --network-deny \
                -- /bin/sh -c "! grep -q eth0: /proc/net/dev"
            '

          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("collector/target/network-isolation-evidence.json").read_text()
          )
          assert evidence["status"] == "complete"
          assert evidence["network"]["requested_mode"] == "deny"
          assert evidence["network"]["enforced"] is True
          assert evidence["network"]["mechanism"] == "linux_network_namespace"
          assert evidence["network"]["attempt_observation"] == "unavailable"
          PY
      - run: cargo test --manifest-path collector/Cargo.toml
      - run: cargo publish --manifest-path collector/Cargo.toml --dry-run

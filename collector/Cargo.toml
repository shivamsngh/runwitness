[package]
name = "runwitness-collector"
version = "0.2.0"
edition = "2024"
description = "Descendant-process evidence collector for RunWitness"
license = "MIT"
repository = "https://github.com/shivamsngh/runwitness"
homepage = "https://github.com/shivamsngh/runwitness"
readme = "../README.md"
keywords = ["ai", "evaluation", "evidence", "mlops", "air-gapped"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

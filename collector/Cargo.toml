[package]
name = "fieldkit-collector"
version = "0.2.0-alpha.1"
edition = "2024"
description = "Descendant-process evidence collector for FieldKit"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

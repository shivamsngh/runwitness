[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runwitness"
version = "0.2.1"
description = "Benchmark-agnostic deployment evidence for AI systems"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Shivam Singh"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://shivam.systems"
Repository = "https://github.com/shivamsngh/runwitness"
Issues = "https://github.com/shivamsngh/runwitness/issues"

[project.scripts]
runwitness = "runwitness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/runwitness/schemas" = ["schemas/aws-evidence-v0.1.schema.json", "schemas/aws-import-v0.1.schema.json"]
